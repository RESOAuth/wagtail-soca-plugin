[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-soca"
version = "0.0.1"
description = "Lean OpenID Connect / OAuth Client ID Metadata Document login for Wagtail"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "RESOAuth"}]
dependencies = [
    "Django>=5.2,<6.2",
    "wagtail>=7.4,<9",
    "PyJWT[crypto]>=2.10.1,<3",
    "cryptography>=44",
    "urllib3>=2.3,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Wagtail",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["build>=1.2,<2", "ruff>=0.11,<1"]
postgres-test = ["psycopg[binary]>=3.2,<4"]

[project.urls]
Source = "https://github.com/RESOAuth/wagtail-soca-plugin"
Issues = "https://github.com/RESOAuth/wagtail-soca-plugin/issues"
Changelog = "https://github.com/RESOAuth/wagtail-soca-plugin/blob/main/docs/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["wagtail_soca*"]

[tool.setuptools.package-data]
wagtail_soca = ["templates/**/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
